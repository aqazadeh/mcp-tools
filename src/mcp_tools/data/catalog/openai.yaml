# OpenAI models, called directly over REST. Needs OPENAI_API_KEY.
# Model ids and fields follow the official client's type definitions. Prices are estimates
# for budgeting (1 credit = 0.001 USD); the provider's bill is authoritative.
# verified_at stays null until a model has been run once with a real key.
# Model ids were confirmed against the live API on 2026-11-19 (doctor --live). Sora prices are
# not on OpenAI's pricing page and remain estimates.
provider: openai
provider_name: OpenAI

models:
  - id: gpt_image_2_6_flare
    name: GPT Image 2.6 Flare
    provider_ref: gpt-image-2.6-flare
    execution: sync
    description: >-
      Newest OpenAI image model, tuned for fast iteration: quick drafts, variations and interactive editing. Same price as GPT Image 2.
    output_type: image
    aspect_ratios: ["1:1", "3:2", "2:3"]
    tags: [image, fast, editing, references, text rendering, openai]
    use_cases: [draft, variations, quick edit, illustration]
    deadline_seconds: 300
    parameters:
      - name: quality
        type: string
        description: Rendering effort; higher costs more and takes longer.
        default: medium
        options: [low, medium, high]
      - name: complexity
        type: string
        description: How much the model plans before rendering. The provider default is high; no extra fee.
        options: [low, medium, high]
      - name: background
        type: string
        description: transparent needs output_format png or webp.
        options: [transparent, opaque, auto]
      - name: output_format
        type: string
        default: png
        options: [png, webp, jpeg]
    medias:
      - role: image
        kinds: [image]
        max: 16
        description: Reference images to edit or combine (switches the call to image editing).
    # Same token rates as gpt-image-2 ($30 per 1M output tokens, 2026-11-19), but a low-quality
    # 1024x1024 image was billed about $0.02 against $0.006 for 2.5 (196 output tokens), most
    # likely the planning that `complexity` (default high) adds. That overhead (~$0.013) is added
    # to gpt-image-2's prices: low ~$0.02, medium ~$0.066, high ~$0.224. Check against
    # provider_usage on real jobs. The image limit of 16 is carried over from gpt-image-2.
    pricing:
      unit: per_output
      credits: 66
      multipliers:
        quality: { low: 0.3, medium: 1, high: 3.4 }

  - id: gpt_image_2_6_sunburst
    name: GPT Image 2.6 Sunburst
    provider_ref: gpt-image-2.6-sunburst
    execution: sync
    description: >-
      Newest OpenAI image model, tuned for detailed visual work: complex compositions, lettering and careful edits. Same price as GPT Image 2.
    output_type: image
    aspect_ratios: ["1:1", "3:2", "2:3"]
    tags: [image, detailed, high quality, editing, references, text rendering, openai]
    use_cases: [poster, product photo, detailed illustration, image editing]
    deadline_seconds: 300
    parameters:
      - name: quality
        type: string
        description: Rendering effort; higher costs more and takes longer.
        default: medium
        options: [low, medium, high]
      - name: complexity
        type: string
        description: How much the model plans before rendering. The provider default is high; no extra fee.
        options: [low, medium, high]
      - name: background
        type: string
        description: transparent needs output_format png or webp.
        options: [transparent, opaque, auto]
      - name: output_format
        type: string
        default: png
        options: [png, webp, jpeg]
    medias:
      - role: image
        kinds: [image]
        max: 16
        description: Reference images to edit or combine (switches the call to image editing).
    # Same token rates as gpt-image-2 ($30 per 1M output tokens, 2026-11-19), but a low-quality
    # 1024x1024 image was billed about $0.02 against $0.006 for 2.5 (196 output tokens), most
    # likely the planning that `complexity` (default high) adds. That overhead (~$0.013) is added
    # to gpt-image-2's prices: low ~$0.02, medium ~$0.066, high ~$0.224. Check against
    # provider_usage on real jobs. The image limit of 16 is carried over from gpt-image-2.
    pricing:
      unit: per_output
      credits: 66
      multipliers:
        quality: { low: 0.3, medium: 1, high: 3.4 }

  - id: gpt_image_2_5_flare
    name: GPT Image 2.5 Flare
    provider_ref: gpt-image-2.5-flare
    execution: sync
    description: >-
      OpenAI's fast image model for high-quality everyday pictures. Prefer GPT Image 2.6 Flare unless you need 2.5's look.
    output_type: image
    aspect_ratios: ["1:1", "3:2", "2:3"]
    tags: [image, fast, editing, references, text rendering, openai]
    use_cases: [everyday image, draft, variations]
    deadline_seconds: 300
    parameters:
      - name: quality
        type: string
        description: Rendering effort; higher costs more and takes longer.
        default: medium
        options: [low, medium, high]
      - name: background
        type: string
        description: transparent needs output_format png or webp.
        options: [transparent, opaque, auto]
      - name: output_format
        type: string
        default: png
        options: [png, webp, jpeg]
    medias:
      - role: image
        kinds: [image]
        max: 16
        description: Reference images to edit or combine (switches the call to image editing).
    # Same token rates as gpt-image-2 ($30 per 1M output tokens, 2026-11-19); OpenAI publishes no
    # per-image price for 2.5, so gpt-image-2's 1024x1024 prices are used. Measured 2026-11-19:
    # 2.5 Flare low, 1024x1024 = 26 input + 196 output tokens = $0.006 (7 credits). The image limit of 16 is
    # carried over from gpt-image-2 and not documented for 2.5. complexity is documented for 2.6 only.
    pricing:
      unit: per_output
      credits: 53
      multipliers:
        quality: { low: 0.12, medium: 1, high: 4 }

  - id: gpt_image_2_5_sunburst
    name: GPT Image 2.5 Sunburst
    provider_ref: gpt-image-2.5-sunburst
    execution: sync
    description: >-
      OpenAI image model for precise editing and detailed generation. Prefer GPT Image 2.6 Sunburst unless you need 2.5's look.
    output_type: image
    aspect_ratios: ["1:1", "3:2", "2:3"]
    tags: [image, detailed, high quality, editing, inpainting, references, openai]
    use_cases: [precise edit, product photo, detailed illustration]
    deadline_seconds: 300
    parameters:
      - name: quality
        type: string
        description: Rendering effort; higher costs more and takes longer.
        default: medium
        options: [low, medium, high]
      - name: background
        type: string
        description: transparent needs output_format png or webp.
        options: [transparent, opaque, auto]
      - name: output_format
        type: string
        default: png
        options: [png, webp, jpeg]
    medias:
      - role: image
        kinds: [image]
        max: 16
        description: Reference images to edit or combine (switches the call to image editing).
    # Same token rates as gpt-image-2 ($30 per 1M output tokens, 2026-11-19); OpenAI publishes no
    # per-image price for 2.5, so gpt-image-2's 1024x1024 prices are used. Measured 2026-11-19:
    # 2.5 Flare low, 1024x1024 = 26 input + 196 output tokens = $0.006 (7 credits). The image limit of 16 is
    # carried over from gpt-image-2 and not documented for 2.5. complexity is documented for 2.6 only.
    pricing:
      unit: per_output
      credits: 53
      multipliers:
        quality: { low: 0.12, medium: 1, high: 4 }

  - id: gpt_4o_mini_tts
    name: GPT-4o mini TTS
    provider_ref: gpt-4o-mini-tts
    execution: sync
    description: Text to speech. The prompt is the text to speak (up to 4096 characters); `instructions` steers tone.
    output_type: audio
    tags: [audio, speech, tts, voice, narration, openai]
    use_cases: [voice-over, narration, read aloud]
    deadline_seconds: 300
    parameters:
      - name: voice
        type: string
        default: alloy
        options: [alloy, ash, ballad, coral, echo, sage, shimmer, verse, marin, cedar, fable, onyx, nova]
      - name: instructions
        type: string
        description: How to speak, e.g. "calm and warm, slow pace".
      - name: response_format
        type: string
        default: mp3
        options: [mp3, wav, flac]
      - name: speed
        type: number
        default: 1.0
        min: 0.25
        max: 4.0
    # $12 per 1M audio output tokens (2026-11-19); about $0.015 per minute of speech, and a
    # minute is roughly 1000 characters.
    pricing:
      unit: per_1k_chars
      credits: 15

  - id: sora_2
    name: Sora 2
    provider_ref: sora-2
    execution: async
    description: Video with synchronised sound from a prompt, optionally starting from one image. 4, 8 or 12 seconds.
    output_type: video
    aspect_ratios: ["16:9", "9:16"]
    tags: [video, sound, cinematic, image to video, openai]
    use_cases: [short clip, social video, animate an image]
    deadline_seconds: 1800
    parameters:
      - name: duration
        type: integer
        description: Clip length in seconds.
        default: 4
        options: [4, 8, 12]
        provider_key: seconds
    medias:
      - role: start_image
        kinds: [image]
        max: 1
        description: Optional first frame; should match the output size.
    pricing:
      unit: per_second
      credits: 100

  - id: sora_2_pro
    name: Sora 2 Pro
    provider_ref: sora-2-pro
    execution: async
    description: Higher-fidelity Sora 2. Slower and about three times the price; use for final renders.
    output_type: video
    aspect_ratios: ["16:9", "9:16"]
    tags: [video, sound, cinematic, high quality, openai]
    use_cases: [final render, hero shot]
    deadline_seconds: 3600
    parameters:
      - name: duration
        type: integer
        description: Clip length in seconds.
        default: 4
        options: [4, 8, 12]
        provider_key: seconds
    medias:
      - role: start_image
        kinds: [image]
        max: 1
        description: Optional first frame; should match the output size.
    pricing:
      unit: per_second
      credits: 300
