[project]
name = "mcp-tools"
version = "0.1.0"
description = "Generative media MCP server (image / video / audio) modelled on the Higgsfield MCP architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp~=2.3.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "aiosqlite>=0.21",
    "starlette>=1.10",
    "uvicorn>=0.31",
    "httpx2>=2.10",
    "anyio>=4.9",
    "pillow>=11",
    "pyyaml>=6",
    "jsonschema>=4.20",
]

[project.scripts]
mcp-tools = "mcp_tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls real provider APIs (needs keys and network; skipped by default)",
    "slow: multi-process or wall-clock tests",
]
filterwarnings = [
    "error::mcp.shared.exceptions.MCPDeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
    "RUF001", # Turkish text in docs and comments
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT018"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
